networks:
  fullstack-network:
    driver: bridge

volumes:
  mysql-data:

services: 
  db: 
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:  ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql 
    networks: 
      - fullstack-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment: 
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE:  ${DB_DATABASE}
    volumes: 
      - ./backend:/app
      - /app/node_modules

    command: sh -c "npm install && npm run dev"

    depends_on:
      db:
        condition: service_healthy

    networks: 
      - fullstack-network

  frontend:
    image: node:20-alpine
    working_dir: /app
    
    ports:
      - "5173:5173"
    
    environment:
      - CHOKIDAR_USEPOLLING=true
      
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

    networks: 
      - fullstack-network


